name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (tags are mutable). See skills/containers-and-ci.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install pyyaml==6.0.2
      - name: Consistency checks
        run: python scripts/validate.py
      - name: Export Hermes profiles (lean + full)
        run: |
          python scripts/export_hermes.py --fleet lean
          python scripts/export_hermes.py --fleet full
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hermes-profiles
          path: dist/hermes/
