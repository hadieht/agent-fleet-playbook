# Defaults. Pipelines may lower these; a stage may lower its pipeline's. Nothing may raise them
# except the human, per task.
per_level:
  0: {max_steps: 8,   max_wallclock_min: 3,   max_workers: 0}
  1: {max_steps: 60,  max_wallclock_min: 30,  max_workers: 2}
  2: {max_steps: 120, max_wallclock_min: 45,  max_workers: 3}
  3: {max_steps: 250, max_wallclock_min: 120, max_workers: 3}

per_agent_default:
  max_steps: 40
  max_wallclock_min: 30

limits:
  max_concurrent_workers: 3
  max_retries_per_stage: 2
  max_critique_rounds: 2
  wrap_up_at_fraction: 0.8      # stop starting new work at 80% of any budget
  no_progress_steps: 3          # 3 steps with no new info/artifact → stop & escalate

spend:
  max_cost_usd_per_task: null   # set per deployment
  alert_daily_usd: null
  on_exceed: stop_and_report
