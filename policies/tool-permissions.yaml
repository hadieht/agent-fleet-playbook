# Deny-by-default tool permissions. An agent may use a tool ONLY if it is listed here
# AND in its own agents/<id>.md `tools.allow`. Where the two differ, the stricter one wins.
default: deny

tool_classes:
  read_only:      [workspace.read, vault.read, vault.search, kanban.read]
  web_read:       [web.search, web.fetch]
  sandbox_exec:   [sandbox.shell, sandbox.code_exec, sandbox.fs]
  sandbox_scan:   [sandbox.scan]   # static analyzers + dependency/secret/IaC scanners on a read-only copy; no network, no secrets
  memory_write:   [vault.write]
  coordination:   [kanban.create, kanban.update, ask_user]
  stage_write:    ["workspace.write:stages/<own>/"]   # own stage folder only (approval-gate.md: auto-allow)
  plan_write:     ["workspace.write:01-plan.md", "workspace.write:final.md", "workspace.write:stages/*/brief.md"]
  gated:          [message.send, email.send, post.publish, payment, purchase, file.delete,
                   git.push, deploy, db.write:prod, permissions.change, calendar.invite]
  never:          [host.shell, secrets:global, vault.delete]

agents:
  atlas:      [read_only, coordination, plan_write, stage_write]
  scout:      [read_only, web_read, stage_write]
  cipher:     [read_only, web_read, stage_write]
  pulse:      [read_only, web_read, stage_write]
  forge:      [read_only, sandbox_exec, stage_write]   # no web: holds scoped secrets; docs come from a research stage
  quant:      [read_only, "sandbox.code_exec", stage_write]
  vega:       [read_only, stage_write]
  rook:       [read_only, sandbox_scan, stage_write, "workspace.write:critique.md"]
  verifier:   [read_only, sandbox_exec, web_read, "workspace.write:stages/*/verify.md"]
  librarian:  [read_only, memory_write, stage_write]
  muse:       [read_only, stage_write]
  gatekeeper: [gated]          # the only path to gated tools, after a human approves

# Hard rule: no agent holds both web_read and (gated or secrets).
# Agents that read untrusted content must not be able to act on it irreversibly.
invariants:
  - "not (web_read and gated)"
  - "not (web_read and secrets)"
  - "verify agent != producing agent"
  - "critique agent != producing agent"
